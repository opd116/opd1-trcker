[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/riot",
    "src-tauri",
]

[workspace.dependencies]
# `bundled`: compiles SQLite from source rather than requiring a system
# libsqlite3 — the Windows CI runner and the user's machine shouldn't need
# one installed. Kept as a workspace dependency (rather than pinned only
# in `crates/core/Cargo.toml`) since Task 5/6/9 in `src-tauri` will also
# need to open/pass around `rusqlite::Connection`.
rusqlite = { version = "0.40", features = ["bundled"] }

# Release profile (R2): smallest installer and lowest RAM are the priority
# (CLAUDE.md: lightness first). Panics still unwind (R138): the JoinSet
# "task failed" logging and the skin-resolve drop guard rely on it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Dev builds: SQLite's C source is `bundled` and would be compiled at -O0, which
# makes every debug-build timing of a query meaningless (B7's scale tests). Its
# -O3 compile is not free: about 49 s on one core, once per cache miss (a clean
# `target/`, or a rusqlite / toolchain bump); later builds reuse it.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
