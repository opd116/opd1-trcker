[package]
name = "opd1-trcker"
version = "0.3.1"
description = "OPD1 TRCKER"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is required so the lib name doesn't collide with the bin
# name on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "opd1_trcker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` (R189, user 2026-10-22): close to tray, Show / Quit menu.
tauri = { version = "2", features = ["tray-icon"] }
# R189 (user-approved plugins, 2026-10-22): "saved player in your match"
# toasts. Driven from Rust only (`v2::window::notify_saved_player`).
tauri-plugin-notification = "2.7"
opd1-core = { path = "../crates/core" }
opd1-riot = { path = "../crates/riot" }
rusqlite = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The in-memory ring-buffer logger (`logbuf.rs`, ruling R30) implements
# `log::Log`; already in the tree via tauri, so no new crate.
log = "0.4"
# `time` (poll-loop timers), `sync` (tables-load mutex), `rt` (`JoinSet`
# for the per-player match-details fan-out). Same tokio tauri already runs
# on — no new crates, only feature edges.
tokio = { version = "1", features = ["time", "sync", "rt"] }
# Decoding the presence `private` blob for the party key (`roster.rs`) —
# same version opd1-core/opd1-riot already use.
base64 = "0.22"
# My Stats' weekday / time-of-day buckets need the local UTC offset
# (`commands::local_offset_ms`). chrono is already in the tree via
# opd1-riot; `clock` only adds `windows-link` on Windows (already pulled in
# by tauri's `windows` crates).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The Windows build number for the log header (`commands::log_header`, B2):
# `RtlGetVersion`, no shim. Already in the tree via tauri's `windows` crates
# (same 0.1.7 in Cargo.lock); Windows only, so nothing is compiled elsewhere.
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

# R189/R193 (user-approved, 2026-10-22): "Launch with Windows" (the `boot`
# setting), starting minimized in the tray (`--minimized`). `auto-launch` is
# the crate `tauri-plugin-autostart` wraps, used directly so the entry always
# goes to the current user's Run key and the exe path is quoted
# (`v2::window::set_autostart`).
auto-launch = "0.6"
# Reads the `Run` value at startup (`v2::window::autostart_at_start`), so an
# entry the user switched off in Task Manager is not re-enabled. Already in
# the tree via `auto-launch` (same 0.6.1 in Cargo.lock): no new crate.
windows-registry = "0.6"

[dev-dependencies]
# `test-support`: `RiotSession::with_global_rate` for the pipeline tests (a
# 200-match backfill can't wait out the production 10 rps). A dev-dependency
# feature: resolver 2 leaves it out of every non-test build (R132).
opd1-riot = { path = "../crates/riot", features = ["test-support"] }
# `pipeline_tests.rs`: drive the real sync pipeline against a mock Riot
# (same wiremock/tokio/tempfile opd1-riot's own tests use — no new crates).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
tempfile = "3"
