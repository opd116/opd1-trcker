name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The UI's Playwright suite (layout, tooltips, navigation) against the DEV demo scenes, on Linux and in its own job:
  # it never waits for the Windows build and the build never waits for it. The two specs that compare with the design
  # file (visual-live, visual-details) skip themselves here: `.superpowers/` is not in the repo.
  ui-e2e:
    runs-on: ubuntu-latest
    # A hung browser must not hold the runner for the default 6 hours.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The browser download (a few hundred MB) is cached per lockfile; `install --with-deps` below still adds the OS
      # libraries and skips the download when the browser is already there.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # The specs fetch the valorant-api images once and keep them here (ui/tests/.cache/media); a cold cache only costs
      # the first run those downloads. Keyed by the demo data that names the images.
      - name: Cache test images
        uses: actions/cache@v4
        with:
          path: ui/tests/.cache/media
          key: ui-test-media-${{ hashFiles('ui/src/lib/demo/*.ts', 'ui/src/lib/demo/meta.json') }}
          restore-keys: ui-test-media-

      - name: Install Chromium for Playwright
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Build UI
        run: npm --prefix ui run build

      - name: Playwright
        working-directory: ui
        run: npx playwright test

      # What a failing spec leaves behind: Playwright's traces and diffs, and the screenshots of every scene.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            ui/test-results
            ui/tests/shots
          if-no-files-found: ignore

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tauri::generate_context!` (the src-tauri crate) needs `ui/dist`, so
      # the UI is built before any Rust test compiles it.
      - name: Build UI
        run: npm --prefix ui run build

      - name: Test Rust crates
        run: cargo test -p opd1-core -p opd1-riot -p opd1-trcker

      - name: Test UI
        run: npm --prefix ui run test

      - name: Check UI (svelte-check + tsc)
        run: npm --prefix ui run check

      # No `demo` cargo feature exists (or is enabled) -- release builds are
      # always the real, non-demo app.
      - name: Build app (NSIS installer)
        run: npx tauri build

      # Demo scenes are DEV-only (R15/R40): a leaked mock roster, a Google
      # Fonts / unpkg reference or the design prototype's runtime must never
      # ship. `VesperUnbreakabl` and `Vantablack` are fixture-only names from
      # `cdv8.ts`, so a leaked scene bundle fails even without the marker.
      - name: Guard ui/dist (no demo code, no CDN)
        shell: bash
        run: |
          if grep -rqE "demo-feed|VesperUnbreakabl|Vantablack|fonts.googleapis|fonts.gstatic|unpkg.com" ui/dist; then echo "demo code or a CDN reference in ui/dist"; exit 1; fi

      # 10 MB = 10485760 bytes (lightness goal, plan Task 19).
      - name: Installer size check (<= 10 MB)
        shell: bash
        run: |
          f=$(ls target/release/bundle/nsis/*.exe); s=$(stat -c %s "$f"); echo "installer $s bytes"; [ "$s" -le 10485760 ]

      # In a Cargo workspace, `target/` lives at the workspace root, not
      # under `src-tauri/`, so that's where the bundler writes the installer.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: OPD1-TRCKER-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
