name: Installer

# The one place the Windows NSIS installer is built. `build.yml` (every push to main, and a manual run) and `release.yml`
# (a published release) both call it, so the build steps, the guards and the 10 MB limit exist exactly once.
on:
  workflow_call:
    inputs:
      # A commit SHA, branch or tag of THIS repository. Empty = the ref of the calling run. `release.yml` passes the full
      # SHA it resolved, to rebuild an older commit whose release is missing. (`actions/checkout` needs a full SHA, not a
      # short one; a branch or tag name is fine.)
      ref:
        description: Full commit SHA, branch or tag to build (empty = the ref of the calling run)
        type: string
        default: ''
      # `main` already ran every UI test in `checks`; the Rust tests here are Windows platform coverage. A release of a
      # commit that was green on main skips them.
      run-tests:
        description: Run the Rust tests on Windows before building
        type: boolean
        default: true
    outputs:
      version:
        description: Version read from src-tauri/tauri.conf.json at the built commit
        value: ${{ jobs.installer.outputs.version }}
      sha:
        description: Full SHA of the built commit
        value: ${{ jobs.installer.outputs.sha }}
      artifact:
        description: Name of the uploaded workflow artifact (it holds OPD1-TRCKER-<version>-setup.exe)
        value: ${{ jobs.installer.outputs.artifact }}

# Reading the source is all this needs. The artifact upload uses the runner's own token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    # A hung build must not hold the runner for the default 6 hours. A cold Rust cache is the slowest case.
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      artifact: ${{ steps.meta.outputs.artifact }}

    steps:
      # An empty `ref` makes the action use the calling run's own ref and SHA. The job only reads: no credentials are
      # left in `.git` for the build scripts and dependencies that run after this.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The full SHA of what is really checked out (a branch name or tag in `ref` is resolved here), and the version the
      # installer will carry. The version is validated because it becomes part of the file, artifact and tag names.
      - name: Resolve commit and version
        id: meta
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./src-tauri/tauri.conf.json').version" | tr -d '\r')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::src-tauri/tauri.conf.json has version '$version', which is not a plain semantic version (like 0.4.0)"
            exit 1
          fi
          echo "commit $sha, version $version"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "artifact=OPD1-TRCKER-$version-setup"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tauri::generate_context!` (the src-tauri crate) needs `ui/dist`, so
      # the UI is built before any Rust test compiles it.
      - name: Build UI
        run: npm --prefix ui run build

      - name: Test Rust crates
        if: ${{ inputs.run-tests }}
        run: cargo test -p opd1-core -p opd1-riot -p opd1-trcker

      # The renaming step below insists on exactly one installer. A bundle folder restored from the Rust cache could hold
      # an older version's installer next to the new one, so the folder is emptied first.
      - name: Remove stale installers
        shell: bash
        run: rm -rf target/release/bundle

      # No `demo` cargo feature exists (or is enabled) -- release builds are
      # always the real, non-demo app.
      - name: Build app (NSIS installer)
        run: npx tauri build

      # Demo scenes are DEV-only (R15/R40): a leaked mock roster, a Google
      # Fonts / unpkg reference or the design prototype's runtime must never
      # ship. `VesperUnbreakabl` and `Vantablack` are fixture-only names from
      # `cdv8.ts`, so a leaked scene bundle fails even without the marker.
      - name: Guard ui/dist (no demo code, no CDN)
        shell: bash
        run: |
          if grep -rqE "demo-feed|VesperUnbreakabl|Vantablack|fonts.googleapis|fonts.gstatic|unpkg.com" ui/dist; then echo "demo code or a CDN reference in ui/dist"; exit 1; fi

      # Tauri names the file `{productName}_{version}_x64-setup.exe` = `OPD1 TRCKER_<version>_x64-setup.exe`, with a space.
      # It becomes `OPD1-TRCKER-<version>-setup.exe`: no space, and the version is in the file you download and send on
      # (C2). In a Cargo workspace `target/` lives at the workspace root, not under `src-tauri/`, so that is where the
      # bundler writes the installer.
      - name: Name the installer
        id: exe
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          shopt -s nullglob
          found=(target/release/bundle/nsis/*.exe)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::expected exactly one NSIS installer in target/release/bundle/nsis, found ${#found[@]}"
            ls -la target/release/bundle/nsis || true
            exit 1
          fi
          dest="target/release/bundle/nsis/OPD1-TRCKER-${VERSION}-setup.exe"
          mv -- "${found[0]}" "$dest"
          echo "renamed '${found[0]}' to '$dest'"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      # 10 MB = 10485760 bytes (lightness goal, plan Task 19). The size is also written to the run's summary page
      # (MB here is MiB, the same unit as the limit).
      - name: Installer size check (<= 10 MB)
        shell: bash
        env:
          EXE: ${{ steps.exe.outputs.path }}
        run: |
          s=$(stat -c %s "$EXE"); mb=$(awk -v s="$s" 'BEGIN { printf "%.2f", s / 1048576 }')
          echo "installer $s bytes ($mb MB)"
          {
            echo "### Installer size"
            echo
            echo "| File | Bytes | MB |"
            echo "| --- | ---: | ---: |"
            echo "| \`$(basename "$EXE")\` | $s | $mb |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$s" -le 10485760 ]

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ steps.exe.outputs.path }}
          if-no-files-found: error
