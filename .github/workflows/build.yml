name: Build

on:
  # Every branch and every PR gets the Linux checks; only `main` (and a manual run) also builds the Windows installer.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      # A manual run with this on does nothing but regenerate the visual baselines (the `baselines-*` jobs) and commit them
      # to the branch it was started on; `checks` and `build` are skipped.
      update_baselines:
        description: Only regenerate the visual baselines (ui/tests/baselines) and commit them to this branch
        type: boolean
        default: false

# Read-only by default; the one job that has to push (`baselines-commit`) asks for more itself.
permissions:
  contents: read

# A newer push to the same branch / PR supersedes the older run. `main` is never cancelled and never queued behind
# another run: its group includes the run id, so two quick pushes both build the installer. A manual run (a normal one,
# or a baselines one) has its own group, so a branch push never cancels it and it never cancels a push; a baselines run
# is never cancelled either, because it ends in a push, and two baselines runs on one branch (`main` included) queue
# instead of racing their pushes. `inputs` is empty on push and pull_request, where the
# expression falls back to `auto`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && !inputs.update_baselines && github.run_id || github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.update_baselines && 'baselines' || 'manual') || 'auto' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !inputs.update_baselines }}

jobs:
  # Everything that does not need Windows, in one Linux job: Rust fmt / clippy / tests, the UI build + its size, Vitest,
  # svelte-check and the Playwright suite (layout, tooltips, navigation) against the DEV demo scenes. It never waits for
  # the Windows build and the build never waits for it. A manual run that only updates the visual baselines skips it
  # (`inputs` is empty on push and pull_request, so `!null` keeps every normal run).
  checks:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-latest
    # A hung browser or build must not hold the runner for the default 6 hours.
    timeout-minutes: 45
    # Playwright's own image: the browsers and their OS libraries are already inside (PLAYWRIGHT_BROWSERS_PATH is set by the
    # image), so there is no browser download or `playwright install`. The tag MUST equal the `@playwright/test` version
    # in package-lock.json; the "Guard Playwright version" step below fails the job when they drift apart. The
    # `baselines-render` job uses the same image: bump its tag and its `want` together with this one.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      # Playwright's advice for Chromium in Docker: share the host's IPC namespace so a small /dev/shm cannot crash a page.
      options: --ipc=host
    defaults:
      run:
        # A container job's default shell can be plain `sh`; every step here is written for bash (with `pipefail`).
        shell: bash

    steps:
      # The image has no `git`, so without it `actions/checkout` would download a tarball and leave no `.git`. The
      # packages after it are Tauri's Linux build libraries (the `src-tauri` crate is compiled by clippy and the tests)
      # and `curl` (rustup is downloaded with it). The container runs as root, so there is no `sudo`.
      - name: Install OS dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y git curl build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev

      # Read-only job: no credentials are left in `.git` while the build and the tests run.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The workspace is mounted from the runner and owned by another user, which git refuses to work in otherwise.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      # The image's browsers belong to exactly one Playwright version. A dependency bump that moves the lockfile must
      # move the image tag above too (and `want` below), otherwise the specs would launch a mismatched browser.
      - name: Guard Playwright version (must match the container image)
        working-directory: ui
        run: |
          want=1.63.0
          have=$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "playwright $have (image v$want)"
          if [ "$have" != "$want" ]; then
            echo "::error title=Playwright version mismatch::@playwright/test resolves to $have but the container image is v$want. Bump the image tag in .github/workflows/build.yml (container.image and 'want' in this step) together with the dependency."
            exit 1
          fi

      # The specs fetch the valorant-api images once and keep them here (ui/tests/.cache/media); a cold cache only costs
      # the first run those downloads. Keyed by the demo data that names the images.
      - name: Cache test images
        uses: actions/cache@v6
        with:
          path: ui/tests/.cache/media
          key: ui-test-media-${{ hashFiles('ui/src/lib/demo/**/*.ts', 'ui/src/lib/demo/meta.json') }}
          restore-keys: ui-test-media-

      # `tauri::generate_context!` (the src-tauri crate) needs `ui/dist`, so
      # the UI is built before clippy or any Rust test compiles it.
      - name: Build UI
        run: npm --prefix ui run build

      # Demo scenes are DEV-only (R15/R40): a leaked mock roster, a Google
      # Fonts / unpkg reference or the design prototype's runtime must never
      # ship. `VesperUnbreakabl` and `Vantablack` are fixture-only names from
      # `cdv8.ts`, so a leaked scene bundle fails even without the marker.
      - name: Guard ui/dist (no demo code, no CDN)
        run: |
          if grep -rqE "demo-feed|VesperUnbreakabl|Vantablack|fonts.googleapis|fonts.gstatic|unpkg.com" ui/dist; then echo "demo code or a CDN reference in ui/dist"; exit 1; fi

      # Lightness is priority #1: the gzipped size of every script and stylesheet is printed here and in the run's
      # summary page, so a change that makes the UI heavier shows up in the PR.
      - name: UI bundle size (gzip)
        run: |
          {
            echo "### UI bundle size (gzip)"
            echo
            echo "| File | Gzip bytes |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          total=0
          count=0
          for f in ui/dist/assets/*.js ui/dist/assets/*.css; do
            [ -f "$f" ] || continue
            s=$(gzip -c "$f" | wc -c)
            total=$((total + s))
            count=$((count + 1))
            echo "$f: $s bytes gzipped"
            echo "| \`$(basename "$f")\` | $s |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$count" -eq 0 ]; then echo "::error::no .js or .css files in ui/dist/assets"; exit 1; fi
          echo "total: $total bytes gzipped"
          echo "| **Total** | **$total** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Rust format
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust crates
        run: cargo test -p opd1-core -p opd1-riot -p opd1-trcker

      - name: Test UI
        run: npm --prefix ui run test

      - name: Check UI (svelte-check + tsc)
        run: npm --prefix ui run check

      # `visual-baseline.spec.ts` skips itself unless VISUAL_BASELINES is set: it compares the DEV scenes with the PNGs in
      # ui/tests/baselines, which are made on this same image (the `baselines-render` job), never on a developer machine.
      - name: Playwright
        working-directory: ui
        env:
          VISUAL_BASELINES: "1"
        run: npx playwright test

      # What a failing spec leaves behind: Playwright's traces and diffs, and the screenshots of every scene.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            ui/test-results
            ui/tests/shots
          if-no-files-found: ignore

  # The installer is only built for `main` and manual runs; branches and PRs stop at `checks`. This job does not `need`
  # `checks`: both start at once, so the installer is ready as soon as it is built and a red check never hides it. It
  # keeps the Rust tests for Windows platform coverage; the UI tests run once, in `checks`. The steps live in
  # installer.yml, which `release.yml` calls too. The artifact is `OPD1-TRCKER-<version>-setup`, one file named
  # `OPD1-TRCKER-<version>-setup.exe`. A baselines-only manual run builds nothing.
  build:
    if: ${{ !inputs.update_baselines && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    uses: ./.github/workflows/installer.yml
    with:
      run-tests: true

  # Manual run with `update_baselines`: regenerates the visual baselines in the same Playwright image `checks` uses (the
  # PNGs only match when they are rendered by the same browser and fonts) and commits them to the branch the run was
  # started on. No Rust is needed: the specs run against the Vite DEV server. It is two jobs so that no job holds a write
  # token while `npm ci` and the browser run (third-party code): `baselines-render` only reads and hands the PNGs over as
  # an artifact; `baselines-commit` has the write token but runs nothing from npm, only git. A push made with
  # GITHUB_TOKEN does not start new workflow runs, so the commit does not trigger `checks`; start a normal run (or push
  # again) to verify it.
  baselines-render:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host
    defaults:
      run:
        shell: bash

    steps:
      # A tag has no branch to commit to. This is the first step so the run fails at once (and loudly: a skipped job would
      # leave a green run that did nothing).
      - name: Require a branch
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error title=Not a branch::start this run on a branch, not on a $GITHUB_REF_TYPE"
            exit 1
          fi

      # `git` for the checkout (which then keeps a real `.git`). There is no Rust here, so none of the Tauri build
      # libraries `checks` installs.
      - name: Install OS dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same guard as in `checks`: the image's browsers belong to exactly one Playwright version.
      - name: Guard Playwright version (must match the container image)
        working-directory: ui
        run: |
          want=1.63.0
          have=$(npx playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "playwright $have (image v$want)"
          if [ "$have" != "$want" ]; then
            echo "::error title=Playwright version mismatch::@playwright/test resolves to $have but the container image is v$want. Bump the image tag in .github/workflows/build.yml (both jobs' container.image and 'want' in both guard steps) together with the dependency."
            exit 1
          fi

      # The same image cache as `checks` (same key), so the scenes render with the same pictures.
      - name: Cache test images
        uses: actions/cache@v6
        with:
          path: ui/tests/.cache/media
          key: ui-test-media-${{ hashFiles('ui/src/lib/demo/**/*.ts', 'ui/src/lib/demo/meta.json') }}
          restore-keys: ui-test-media-

      # The committed PNGs are removed first: what the spec writes is then the complete set (a renamed or removed scene
      # leaves no orphan), and the guard below cannot be satisfied by the files that came with the checkout.
      - name: Regenerate the visual baselines
        working-directory: ui
        env:
          VISUAL_BASELINES: "1"
        run: |
          mkdir -p tests/baselines
          find tests/baselines -type f -name '*.png' -delete
          npx playwright test visual-baseline.spec.ts --update-snapshots

      # A wrong snapshot path (the spec or the config writing somewhere else) must not look like a success.
      - name: Guard (the baseline PNGs exist)
        run: |
          count=$(find ui/tests/baselines -type f -name '*.png' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error title=No baselines::the run wrote no PNG under ui/tests/baselines; check the snapshot path of visual-baseline.spec.ts"
            exit 1
          fi
          echo "$count baseline PNGs"
          echo "$count baseline PNGs were rendered." >> "$GITHUB_STEP_SUMMARY"

      # `include-hidden-files` keeps a `.gitkeep` or similar if the folder has one.
      - name: Upload the baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: ui/tests/baselines
          # A "re-run all jobs" of the same run uploads again under the same name.
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Puts the rendered PNGs on the branch. Only git runs here (no npm, no browser), so the write token never meets
  # third-party code. Commits only when a file really changed, then lays the commit on top of whatever was pushed to the
  # branch in the meantime.
  baselines-commit:
    needs: baselines-render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Require a branch
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error title=Not a branch::start this run on a branch, not on a $GITHUB_REF_TYPE"
            exit 1
          fi

      # The only checkout that keeps the token: `git push` below needs it.
      - name: Checkout
        uses: actions/checkout@v7

      # The old PNGs go first, so a baseline the render no longer made is deleted from the branch too.
      - name: Clear the old baselines
        run: rm -rf ui/tests/baselines

      - name: Download the rendered baselines
        uses: actions/download-artifact@v7
        with:
          name: visual-baselines
          path: ui/tests/baselines

      - name: Commit and push the baselines
        run: |
          if [ -z "$(find ui/tests/baselines -type f -name '*.png' -print -quit)" ]; then
            echo "::error title=No baselines::the downloaded artifact has no PNG; not touching the branch"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/tests/baselines
          if git diff --cached --quiet; then
            echo "The baselines did not change; nothing to commit."
            echo "The baselines did not change; nothing was committed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "test(ui): update the visual baselines" -- ui/tests/baselines
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"refs/heads/$GITHUB_REF_NAME"
          echo "The visual baselines were committed to \`$GITHUB_REF_NAME\` ($(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"
