name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Rust crates
        run: cargo test -p opd1-core -p opd1-riot

      - name: Test UI
        run: npm --prefix ui run test

      # No `demo` cargo feature exists (or is enabled) -- release builds are
      # always the real, non-demo app.
      - name: Build app (NSIS installer)
        run: npx tauri build

      # In a Cargo workspace, `target/` lives at the workspace root, not
      # under `src-tauri/`, so that's where the bundler writes the installer.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPD1-TRCKER-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
