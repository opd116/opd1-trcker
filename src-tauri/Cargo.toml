[package]
name = "opd1-trcker"
version = "0.1.0"
description = "OPD1 TRCKER"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is required so the lib name doesn't collide with the bin
# name on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "opd1_trcker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
